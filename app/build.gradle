plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.myapplicationnetwork'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.myapplicationnetwork"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':backend')
    implementation("com.fasterxml.jackson.core:jackson-databind:2.15.0") // Or the latest version
    // στο build.gradle (app) βεβαιώσου ότι έχεις dependency, π.χ. για Glide:
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.14.2'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}